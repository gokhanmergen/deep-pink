name: Release

# Builds Tauri packages for Linux, macOS and Windows and attaches them to a GitHub release.
#
# Two ways to run it:
#
#   Tag a version — builds and publishes a real release:
#     pnpm version patch          # writes package.json and tags
#     git push --follow-tags
#
#   Run it by hand from the Actions tab — builds the packages, and publishes
#   them only if you tick "Create a GitHub release". Left unticked it just
#   produces downloadable artefacts, which is the way to rehearse a release
#   without creating one.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub release from the version in package.json
        type: boolean
        default: false
      draft:
        # Off by default: a draft is invisible to anything reading
        # /releases/latest, so an updater will never see it.
        description: Hold it back as a draft instead of publishing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Answered once, before anything is built: every job below agrees on what is
  # being released, and a tag that lies about its contents stops the run here
  # rather than after twenty minutes of building.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version being released
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A tag is a promise about what is inside; make sure it is true.
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 provides WebKitGTK 4.1 while keeping the Linux binary
          # baseline usable on older glibc-based distributions.
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          # Build the Node runtime and SQLite module natively for each platform.
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev \
            libasound2 libdbus-1-dev libgtk-3-dev libnotify4 libnss3 pkg-config \
            libsecret-1-0 libsecret-1-dev libssl-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev libxdo-dev libxss1 libxtst6 rpm xvfb xdg-utils

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # A version that fails its own tests should not become a release. The
      # suites run inside Electron and one of them drives a real window, so they
      # run on the Linux machine, under a virtual display, as the gate for every
      # platform — the code under test is the same on all of them.
      - name: Test
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test

      - name: Build the Linux packages
        if: matrix.platform == 'linux'
        run: pnpm run dist:linux

      - name: Build the macOS disk image
        if: matrix.platform == 'mac'
        run: pnpm run dist:mac

      - name: Build the Windows installer
        if: matrix.platform == 'windows'
        run: pnpm run dist:windows

      - name: Collect the artefacts
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.dmg' -o -name '*.exe' \) \
            -exec cp {} artifacts/ \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: deep-pink-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.meta.outputs.version }}
          path: artifacts/
          retention-days: 14

  publish:
    needs: [meta, build]
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      # Everything every platform built, in one directory.
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # Written here rather than per platform, so the file covers the whole
      # release instead of one machine's share of it.
      - name: Checksum every file being published
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Deep Pink ${{ needs.meta.outputs.version }}
          files: artifacts/*
          # A tag push always publishes. A manual run publishes too unless the
          # draft box was ticked.
          draft: ${{ github.ref_type != 'tag' && inputs.draft }}
          # Never a prerelease: /releases/latest skips those, and an updater
          # pointed at "latest" would silently never update.
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            Builds of Deep Pink ${{ needs.meta.outputs.version }}.

            **Linux** (x86-64)

            | Format | Use it when |
            | --- | --- |
            | `.deb` | Debian, Ubuntu, Mint |
            | `.rpm` | Fedora, openSUSE, RHEL |
            | `.AppImage` | A portable single-file install |

            **macOS**

            | Format | Use it when |
            | --- | --- |
            | `-aarch64.dmg` | Apple Silicon — M1 and later |
            | `-x64.dmg` | Intel Macs |

            **Windows**

            | Format | Use it when |
            | --- | --- |
            | `-setup.exe` | Windows x86-64 installer |

            Verify a download against `SHA256SUMS.txt`:

            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            macOS builds use ad-hoc signing and may require approval in Privacy & Security after the first launch attempt. Windows may show SmartScreen before installation. No paid developer certificates are configured.
