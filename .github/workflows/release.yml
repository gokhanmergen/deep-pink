name: Release

# Builds the Linux packages and attaches them to a GitHub release.
#
# Two ways to run it:
#
#   Tag a version — builds and publishes a real release:
#     pnpm version patch          # writes package.json and tags
#     git push --follow-tags
#
#   Run it by hand from the Actions tab — builds the packages, and publishes
#   them only if you tick "Create a GitHub release". Left unticked it just
#   produces downloadable artefacts, which is the way to rehearse a release
#   without creating one.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub release from the version in package.json
        type: boolean
        default: false
      draft:
        # Off by default: a draft is invisible to anything reading
        # /releases/latest, so an updater will never see it.
        description: Hold it back as a draft instead of publishing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install system libraries Electron needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libxss1 libasound2t64 libsecret-1-0 \
            rpm fakeroot xvfb

      - run: pnpm install --frozen-lockfile

      # A version that fails its own tests should not become a release.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: xvfb-run --auto-servernum pnpm test

      - name: Work out the version being released
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A tag is a promise about what is inside; make sure it is true.
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

      # No token here on purpose: given one, electron-builder tries to publish
      # the artefacts itself. Publishing is the release step's job.
      - name: Build AppImage, deb, rpm and tarball
        run: pnpm run dist:linux

      - name: Collect the artefacts
        run: |
          mkdir -p artifacts
          find release -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \) \
            -exec cp {} artifacts/ \;
          ( cd artifacts && sha256sum * > SHA256SUMS.txt )
          ls -lh artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: deep-pink-linux-${{ steps.meta.outputs.version }}
          path: artifacts/
          retention-days: 14

      - name: Publish the release
        if: github.ref_type == 'tag' || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Deep Pink ${{ steps.meta.outputs.version }}
          files: artifacts/*
          # A tag push always publishes. A manual run publishes too unless the
          # draft box was ticked.
          draft: ${{ github.ref_type != 'tag' && inputs.draft }}
          # Never a prerelease: /releases/latest skips those, and an updater
          # pointed at "latest" would silently never update.
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            Linux builds of Deep Pink ${{ steps.meta.outputs.version }}.

            | Format | Use it when |
            | --- | --- |
            | `.AppImage` | You want a single file — `chmod +x` it and run |
            | `.deb` | Debian, Ubuntu, Mint |
            | `.rpm` | Fedora, openSUSE, RHEL |
            | `.tar.gz` | You would rather unpack it yourself |

            Built for x86-64.

            Verify a download against `SHA256SUMS.txt`:

            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            These builds are unsigned, so your desktop may ask you to confirm
            the first launch.
