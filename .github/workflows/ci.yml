name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system libraries Electron needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libxss1 libasound2t64 libsecret-1-0 xvfb

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # The suite runs inside Electron, so it needs a display.
        run: xvfb-run --auto-servernum npm test

      - name: Build
        run: npm run build
