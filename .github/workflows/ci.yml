name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install desktop app build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libdbus-1-dev pkg-config \
            libasound2t64 libgtk-3-dev libnotify4 libnss3 libsecret-1-0 \
            libsecret-1-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            libxss1 librsvg2-dev libxtst6 xdg-utils xvfb

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        # The suites run inside Electron, so they need a display.
        run: xvfb-run --auto-servernum pnpm test

      - name: Build
        run: pnpm run build
