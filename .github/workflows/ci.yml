name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install system libraries Electron needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libgtk-3-dev pkg-config libnss3 libxss1 libasound2t64 libsecret-1-0 xvfb

      - run: just install-ci

      - name: Typecheck
        run: just typecheck

      - name: Test
        # The suites run inside Electron, so they need a display.
        run: xvfb-run --auto-servernum just test

      - name: Build
        run: just build
