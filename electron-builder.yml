appId: dev.deeppink.app
productName: Deep Pink
copyright: Copyright © 2026 Deep Pink contributors

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'

extraResources:
  - from: build/native
    to: native

asarUnpack:
  - '**/node_modules/better-sqlite3/**'

npmRebuild: true

# Releases are published by the GitHub Actions workflow. electron-builder must
# not try to upload anything itself — given a token it will, slowly, and then
# fail because the release does not exist yet.
publish: null

linux:
  # A full-bleed tile: Linux desktops draw the icon as-is, with no rounding of
  # their own, so the padded macOS variant would look undersized here.
  #
  # A directory rather than the one file, which is what puts the icon in the
  # launcher at all. Given a single 1024px PNG, electron-builder installs
  # exactly that — `hicolor/1024x1024/apps/deep-pink.png` and nothing else —
  # and hicolor is an index of sizes rather than a pile of images: a desktop
  # looking for 48px finds no directory to look in and falls back to a blank
  # tile. Installed from the package on Arch, that is a launcher entry with no
  # picture on it.
  #
  # The sizes here are the ones the theme is indexed at, generated from the
  # same source so there is nothing to keep in step by hand.
  icon: build/icons
  # Names the installed .desktop file after `desktopName` in package.json, which
  # is also where Electron reads its app_id from — so the running window's
  # WM_CLASS / Wayland app_id and the entry's StartupWMClass are the same
  # string, and the desktop can tell that this window belongs to that launcher.
  # Without it a pinned icon and a running window are two unrelated things.
  syncDesktopName: true
  # Debian and RPM packages require a maintainer with a real address. This is
  # the GitHub no-reply address for the account, so no personal mailbox ends up
  # in published package metadata.
  maintainer: gokhanmergen <gokhanmergen@users.noreply.github.com>
  # An AppImage is a squashfs mounted over FUSE, and every byte of the runtime
  # is gunzipped on the way out of it — 346MB of it, on every launch. Measured
  # on an Arch machine (2026-09-21), the same build reached its own first line
  # of code in 1,444-1,810ms as an AppImage and 391-515ms extracted. It is the
  # single largest thing between clicking the icon and seeing a window, and
  # none of it is the app.
  #
  # So it is one option among several rather than the one to reach for, and
  # every other target here is a plain directory of files. `pacman` is listed
  # because there was no native package for the distribution this is mostly
  # developed and used on, which left its own author on the slow path.
  target:
    - AppImage
    - deb
    - rpm
    - pacman
    - tar.gz
  category: Network;InstantMessaging;Utility
  synopsis: Local-first desktop AI chat for OpenRouter
  description: >-
    Deep Pink is an open-source desktop chat client for OpenRouter models.
    Threads, usage statistics and settings are stored locally in SQLite; the
    only network calls the app makes are the ones you ask it to.
  desktop:
    entry:
      Name: Deep Pink
      Comment: Local-first desktop AI chat for OpenRouter
      Keywords: AI;Chat;LLM;OpenRouter;

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

# fpm names this after the target, so it would arrive as `.pacman` — a name
# neither `repo-add` nor `pacman -U` recognises, both of which want
# `*.pkg.tar.*`. Spelled out rather than left to `${ext}`, and `.xz` because
# that is the compression fpm is given by default; the name has to be true.
pacman:
  artifactName: ${name}-${version}-${arch}.pkg.tar.xz
  # Spelled out because electron-builder's default list has two packages in it
  # that Arch no longer has — `http-parser` and `libappindicator-gtk3` — and a
  # dependency that cannot be resolved is not a warning, it is a package that
  # refuses to install. Checked against the repositories on 2026-09-21; the
  # rest of the list is electron-builder's, unchanged.
  #
  # `libsecret` is added, as it is for deb and rpm: it backs encrypted key
  # storage, and without it the app runs but keeps the OpenRouter key as a
  # permission-restricted file instead.
  depends:
    - c-ares
    - ffmpeg
    - gtk3
    - libevent
    - libvpx
    - libxslt
    - libxss
    - minizip
    - nss
    - re2
    - snappy
    - libnotify
    - libsecret

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

rpm:
  depends:
    - libsecret

mac:
  category: public.app-category.productivity
  # Spelled out because the default drops the suffix for Intel, which would put
  # two differently-built disk images under the same name in a release.
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Padded to Apple's 824-in-1024 grid so it lines up with other Dock icons.
  icon: build/icon.icns
  # Ad-hoc signature. Apple Silicon refuses to launch an unsigned binary, and
  # this project has no Developer ID — so sign locally with '-' and let anyone
  # building for distribution override it.
  identity: '-'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip

win:
  icon: build/icon.ico
  target:
    - nsis
