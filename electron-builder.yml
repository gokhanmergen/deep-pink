appId: dev.deeppink.app
productName: Deep Pink
copyright: Copyright © 2026 Deep Pink contributors

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asarUnpack:
  - '**/node_modules/better-sqlite3/**'

npmRebuild: true

# Releases are published by the GitHub Actions workflow. electron-builder must
# not try to upload anything itself — given a token it will, slowly, and then
# fail because the release does not exist yet.
publish: null

linux:
  # Debian and RPM packages require a maintainer with a real address. This is
  # the GitHub no-reply address for the account, so no personal mailbox ends up
  # in published package metadata.
  maintainer: gokhanmergen <gokhanmergen@users.noreply.github.com>
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  category: Network;InstantMessaging;Utility
  synopsis: Local-first desktop AI chat for OpenRouter
  description: >-
    Deep Pink is an open-source desktop chat client for OpenRouter models.
    Threads, usage statistics and settings are stored locally in SQLite; the
    only network calls the app makes are the ones you ask it to.
  desktop:
    entry:
      Name: Deep Pink
      Comment: Local-first desktop AI chat for OpenRouter
      Keywords: AI;Chat;LLM;OpenRouter;

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

rpm:
  depends:
    - libsecret

mac:
  category: public.app-category.productivity
  # Ad-hoc signature. Apple Silicon refuses to launch an unsigned binary, and
  # this project has no Developer ID — so sign locally with '-' and let anyone
  # building for distribution override it.
  identity: '-'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip

win:
  target:
    - nsis
